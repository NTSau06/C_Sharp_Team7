<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="340" height="68" role="img" aria-label="SportZone - Dụng cụ thể thao chính hãng">
  <defs>
    <linearGradient id="szBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A314C"/>
      <stop offset="100%" stop-color="#2E5278"/>
    </linearGradient>
    <linearGradient id="szGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD447"/>
      <stop offset="55%" stop-color="#F4B400"/>
      <stop offset="100%" stop-color="#D99200"/>
    </linearGradient>
  </defs>
  <!-- Shield emblem -->
  <g transform="translate(2,2)">
    <path d="M32 2 L58 10 C60 10.6 61 12.2 61 14 L61 32 C61 48 49 58 32 63 C15 58 3 48 3 32 L3 14 C3 12.2 4 10.6 6 10 Z" fill="url(#szBg)" stroke="url(#szGold)" stroke-width="2.6"/>
    <!-- Dynamic stadium arc -->
    <path d="M13 43 C19 49 34 51 50 37" stroke="rgba(255,255,255,0.22)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Speed wings left -->
    <path d="M11 22 L22 22 L19 26 L11 26 Z" fill="rgba(255,255,255,0.25)"/>
    <path d="M13 29 L21 29 L19 32 L13 32 Z" fill="rgba(255,255,255,0.18)"/>
    <!-- Gold athletic lightning Z/S bolt -->
    <path d="M21 17 L45 17 L34 31 L46 31 L24 50 L31 35 L19 35 Z" fill="url(#szGold)"/>
    <!-- Crisp highlight slash -->
    <path d="M36 17 L45 17 L34 31 L29 31 Z" fill="#FFF3C4" opacity="0.55"/>
  </g>
  <!-- Wordmark -->
  <text x="78" y="38" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="1.2" fill="#FFFFFF">SPORT<tspan fill="#F4B400">ZONE</tspan></text>
  <text x="79" y="55" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="2.4" fill="#CBD5E1">PRO SPORTS GEAR</text>
</svg>
